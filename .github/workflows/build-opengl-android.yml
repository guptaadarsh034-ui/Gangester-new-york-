name: Build GNY OpenGL Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'engine/**'
      - '.github/workflows/build-opengl-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate original 3D OBJ assets
        run: python3 engine/tools/generate_models.py
      - name: Build Android APK
        working-directory: engine
        run: gradle :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gangster-new-york-opengl-debug-apk
          path: engine/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error