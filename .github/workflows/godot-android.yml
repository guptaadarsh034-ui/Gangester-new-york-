name: Godot Android APK
on:
  push:
    branches: [godot-migration, main, graphics-overhaul-0.3.0, mobile-gameplay-overhaul-0.4.0, world-expansion-0.5.0, graphics-rebuild-0.6.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"
      - name: Install Godot and matching Android templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Configure headless Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Fetch licensed CC0 city art assets
        run: |
          mkdir -p /tmp/kenney assets/kenney/city-suburban assets/kenney/city-roads
          curl -fL --retry 5 --retry-all-errors --retry-delay 4 --connect-timeout 30 --max-time 600 https://codeload.github.com/petroulacl/fps-buildings-env-kit/zip/1dd8e932402deb82422920df2e7fd079391e55d3 -o /tmp/kenney-assets.zip
          unzip -q /tmp/kenney-assets.zip \
            'fps-buildings-env-kit-1dd8e932402deb82422920df2e7fd079391e55d3/buildings/kenney-city-kit-suburban/Models/GLB format/*' \
            'fps-buildings-env-kit-main/buildings/kenney-city-kit-suburban/License.txt' \
            'fps-buildings-env-kit-main/props/kenney-city-kit-roads/Models/GLB format/*' \
            'fps-buildings-env-kit-main/props/kenney-city-kit-roads/License.txt' \
            -d /tmp/kenney
          cp -a '/tmp/kenney/fps-buildings-env-kit-main/buildings/kenney-city-kit-suburban/Models' assets/kenney/city-suburban/
          cp '/tmp/kenney/fps-buildings-env-kit-main/buildings/kenney-city-kit-suburban/License.txt' assets/kenney/city-suburban/
          cp -a '/tmp/kenney/fps-buildings-env-kit-main/props/kenney-city-kit-roads/Models' assets/kenney/city-roads/
          cp '/tmp/kenney/fps-buildings-env-kit-main/props/kenney-city-kit-roads/License.txt' assets/kenney/city-roads/
          test -s 'assets/kenney/city-suburban/Models/GLB format/building-type-a.glb'
          test -s 'assets/kenney/city-roads/Models/GLB format/light-square.glb'
      - name: Validate project scripts and import resources
        run: |
          godot --headless --editor --path . --import
          set -o pipefail
          godot --headless --path . --quit-after 3 --verbose 2>&1 | tee /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-runtime.log; then exit 1; fi
      - name: Export ARM64 debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/GangsterNewYork.apk
          test -s build/GangsterNewYork.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/GangsterNewYork.apk | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: gangster-new-york-godot-android-apk
          path: build/GangsterNewYork.apk
          if-no-files-found: error
