plugins { id 'com.android.application' }
configurations { natives }
android {
    namespace 'com.nexusdev.gny'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nexusdev.gny'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0-opengl'
    }
    sourceSets.main.jniLibs.srcDirs = ['libs']
}
dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
}
tasks.register('copyAndroidNatives') {
    doLast {
        configurations.natives.files.each { jarFile ->
            def targetDir = jarFile.name.contains('armeabi-v7a') ? file('libs/armeabi-v7a') : file('libs/arm64-v8a')
            copy { from zipTree(jarFile); into targetDir; include '**/*.so'; eachFile { details -> details.path = details.name } }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'copyAndroidNatives' }